plugins {
    id "com.android.library"
}

def pluginName = "PushUpPose"
def godotAddonBin = "../../addons/pushup_pose/bin"

android {
    namespace "com.dale20.pushuppose"
    compileSdk 36
    buildToolsVersion "36.1.0"

    defaultConfig {
        minSdk 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Provided by the Godot app at runtime; must match the editor version.
    compileOnly "org.godotengine:godot:4.7.0.stable"

    // Keep in sync with addons/pushup_pose/export_plugin.gd (DEPENDENCIES).
    implementation "androidx.camera:camera-core:1.4.2"
    implementation "androidx.camera:camera-camera2:1.4.2"
    implementation "androidx.camera:camera-lifecycle:1.4.2"
    // Bundled base model: ships in the APK, works offline from first launch.
    implementation "com.google.mlkit:pose-detection:18.0.0-beta5"
}

// Copy AARs into the Godot add-on after each build: ./gradlew :plugin:assemble
tasks.register("copyAars", Copy) {
    dependsOn "assembleDebug", "assembleRelease"
    from("build/outputs/aar") {
        include "plugin-debug.aar", "plugin-release.aar"
        rename "plugin-(debug|release).aar", "${pluginName}-\$1.aar"
    }
    into godotAddonBin
}
afterEvaluate {
    tasks.named("assemble").configure { finalizedBy "copyAars" }
}
